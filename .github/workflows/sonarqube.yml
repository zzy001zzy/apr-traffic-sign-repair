name: SonarQube Cloud

on:
  push:
    branches: [codex/public-release]
  pull_request:
    branches: [codex/public-release]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  analysis:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install CPU inference runtime and coverage
        run: |
          python -m pip install --upgrade 'setuptools>=83'
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.13.0
          python -m pip install numpy==2.4.4 opencv-python-headless==5.0.0.93 safetensors==0.8.0 coverage==7.16.2
          python -m pip install --no-deps -e .
      - name: Run CPU regression tests and export coverage
        run: |
          python -m coverage run -m unittest discover -s tests -v
          python -m coverage report
          python -m coverage xml -o coverage.xml
      - name: Analyze all published Python and web sources
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
