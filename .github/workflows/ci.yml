name: Artifact checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  cpu-and-licenses:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install CPU runtime and release tooling
        run: |
          python -m pip install --upgrade 'setuptools>=83'
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.13.0
          python -m pip install numpy==2.4.4 opencv-python-headless==5.0.0.93 safetensors==0.8.0
          python -m pip install -e '.[dev]'
      - name: Check Python warnings and common mistakes
        run: python -m ruff check --no-cache apr_repair tests
      - name: Analyze Python security with all Bandit checks
        run: python -m bandit -r apr_repair -f json
      - name: Check CPU inference and release contracts
        run: |
          python -m coverage run -m unittest discover -s tests -v
          python -m coverage report
      - name: Build the distributable from source
        run: env -u PYTHONDONTWRITEBYTECODE python -m build --wheel
      - name: Audit installed runtime and development dependencies
        run: |
          python -m pip_audit --local --skip-editable --progress-spinner off
          python -c "import importlib.metadata as m; from packaging.version import Version; print('torch==' + Version(m.version('torch')).base_version)" > "$RUNNER_TEMP/apr-torch-audit.txt"
          python -m pip_audit --no-deps --disable-pip -r "$RUNNER_TEMP/apr-torch-audit.txt" --progress-spinner off
      - name: Check file-level licensing
        run: python -m reuse lint
